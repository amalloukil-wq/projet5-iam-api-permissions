server.port=8000

spring.datasource.url=jdbc:postgresql://localhost:5433/docs
spring.datasource.username=docs
spring.datasource.password=docs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Keycloak : app.kc-url = adresse publique (valeur de iss dans les jetons) ;
# app.kc-internal-url = adresse utilisee par l'API pour joindre Keycloak (par defaut la meme)
app.kc-url=http://localhost:8080
app.kc-internal-url=${app.kc-url}
app.realm=examen
app.audience=api-examen
app.api-client-id=api
app.api-client-secret=api-secret

# Origine autorisee (CORS) : le frontend Angular
app.cors-origin=http://localhost:4200
